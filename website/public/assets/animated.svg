<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Gidem Orbit G motion</title>
  <desc id="desc">세 개의 실행 노드가 G의 트랙을 돌아 증거 레일에 도킹한 뒤 검증 완료 상태로 전환된다.</desc>
  <style>
    #static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #motion { display: none; }
      #static { display: inline; }
    }
  </style>
  <g fill="none" stroke="#F0F3F6" stroke-width="8">
    <path d="M50 19.4A22 22 0 1 0 54 32"/>
    <path d="M54 32H48"/>
  </g>
  <g id="motion">
    <rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="#6FB3FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.01s" fill="freeze"/>
      <animateMotion path="M50 19.4A22 22 0 1 0 54 32L27 32" begin="0.15s" dur="1.5s" calcMode="spline" keyTimes="0;1" keySplines="0.32 0 0.16 1" fill="freeze"/>
      <animate attributeName="fill" to="#5FD08A" begin="2.35s" dur="0.25s" fill="freeze"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="#6FB3FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.01s" fill="freeze"/>
      <animateMotion path="M50 19.4A22 22 0 1 0 54 32L35 32" begin="0.45s" dur="1.5s" calcMode="spline" keyTimes="0;1" keySplines="0.32 0 0.16 1" fill="freeze"/>
      <animate attributeName="fill" to="#5FD08A" begin="2.35s" dur="0.25s" fill="freeze"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="#6FB3FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.01s" fill="freeze"/>
      <animateMotion path="M50 19.4A22 22 0 1 0 54 32L43 32" begin="0.75s" dur="1.5s" calcMode="spline" keyTimes="0;1" keySplines="0.32 0 0.16 1" fill="freeze"/>
      <animate attributeName="fill" to="#5FD08A" begin="2.35s" dur="0.25s" fill="freeze"/>
    </rect>
  </g>
  <g id="static" fill="#5FD08A">
    <rect x="40" y="29" width="6" height="6" rx="1.5"/>
    <rect x="32" y="29" width="6" height="6" rx="1.5"/>
    <rect x="24" y="29" width="6" height="6" rx="1.5"/>
  </g>
</svg>
