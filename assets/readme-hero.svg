<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Gidem</title>
  <desc id="desc">Agents run. Evidence decides. 세 실행 노드가 Orbit G를 완성하는 단회 애니메이션.</desc>
  <style>
