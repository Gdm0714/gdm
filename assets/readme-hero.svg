        <animateMotion path="M50 19.4A22 22 0 1 0 54 32L35 32" begin="0.45s" dur="1.5s" calcMode="spline" keyTimes="0;1" keySplines="0.32 0 0.16 1" fill="freeze"/>
        <animate attributeName="fill" to="#5FD08A" begin="2.35s" dur="0.25s" fill="freeze"/>
