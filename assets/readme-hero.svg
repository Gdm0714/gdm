  <text x="310" y="112" fill="#F0F3F6" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="66" font-weight="600" letter-spacing="1.2">Gidem</text>
  <text x="314" y="151" fill="#A9B2BA" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="1.8">Agents run. Evidence decides.</text>
  <text x="314" y="192" fill="#7B858D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1">CONTRACT → RUN → VERIFY → OBSERVE → IMPROVE</text>
