[package]
name = "gdm"
version = "0.14.0"
edition = "2024"
rust-version = "1.97"
description = "Evidence-driven coding agent harness"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
des = "0.8"
fs2 = "0.4"
getrandom = "0.4"
hex = "0.4"
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
png = "0.18"
regex = "1"
rustix = { version = "1", features = ["process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml_edit = "0.22"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
