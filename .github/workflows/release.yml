name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source before release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install QA tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Match tag and package version
        run: |
          version="$(bun -e 'console.log(require("./cli/package.json").version)')"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Require the tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Run full verification
        working-directory: cli
        run: bun run verify
      - name: Validate the release workflow
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$base/$asset" -o "$tmp/$asset"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$asset" > "$tmp/selected-checksum.txt"
          (cd "$tmp" && sha256sum --check selected-checksum.txt)
          tar -xzf "$tmp/$asset" -C "$tmp"
          "$tmp/actionlint" -color=false \
            .github/workflows/ci.yml \
            .github/workflows/release.yml
      - name: Verify release packaging
        run: script/qa/gdm-release-qa.zsh

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Confirm native runner architecture
        run: |
          expected="${{ matrix.arch }}"
          actual="$(uname -m)"
          case "$expected" in
            x64) test "$actual" = x86_64 ;;
            arm64) test "$actual" = arm64 || test "$actual" = aarch64 ;;
            *) echo "unknown release architecture: $expected" >&2; exit 1 ;;
          esac
      - name: Build native binary
        working-directory: cli
        run: |
          mkdir -p ../dist
          bun build src/cli.ts --compile --outfile "../dist/gdm-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Smoke native binary
        run: |
          expected="$(bun -e 'console.log(require("./cli/package.json").version)')"
          test "$(./dist/gdm-${{ matrix.os }}-${{ matrix.arch }} --version)" = "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdm-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/gdm-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gdm-*
          path: dist/native
          merge-multiple: true
      - name: Install QA tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Restore artifact executable modes
        run: chmod 0755 dist/native/gdm-darwin-arm64 dist/native/gdm-darwin-x64 dist/native/gdm-linux-arm64 dist/native/gdm-linux-x64
      - name: Package skills and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          script/release/gdm-package.zsh \
            --bin-dir dist/native \
            --out dist/release \
            --version "$version"
      - name: Verify complete release
        env:
          GDM_RELEASE_DIR: dist/release
          GDM_EXPECTED_VERSION: ${{ github.ref_name }}
        run: script/qa/gdm-release-qa.zsh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/gdm-darwin-arm64 \
            dist/release/gdm-darwin-x64 \
            dist/release/gdm-linux-arm64 \
            dist/release/gdm-linux-x64 \
            dist/release/gdm-skills.tar.gz \
            dist/release/SHASUMS256.txt \
            --verify-tag \
            --title "gdm $GITHUB_REF_NAME" \
            --generate-notes
