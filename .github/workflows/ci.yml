name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 필수 검증
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI 표기 금지 검사 (현재 변경 커밋)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="HEAD"
          fi
          BAD=$(git log "$RANGE" --format='%H %s%n%b' | grep -inE 'claude|클로드|co-authored-by|generated (with|by)' || true)
          if [ -n "$BAD" ]; then
            echo "커밋 메시지에 금지 표기가 있습니다:"
            echo "$BAD"
            exit 1
          fi
          echo "검사 범위 $RANGE — 금지 표기 0건"
      - uses: oven-sh/setup-bun@v2
      - name: 의존성 설치
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: 타입체크·테스트·커버리지·빌드·스모크
        working-directory: cli
        run: bun run verify
      - name: 스킬 front-matter 검증
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "front-matter 누락: $f"; exit 1; }
            grep -q '^name: gdm-' "$f" || { echo "name 필드 누락: $f"; exit 1; }
          done
          echo "스킬 $(ls -d skills/*/ | wc -l)개 front-matter 정상"
